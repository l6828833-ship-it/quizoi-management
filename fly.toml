# fly.toml app configuration file generated for quizoi-management on 2026-08-22T20:17:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quizoi-management'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    SUPABASE_URL = "https://anjnjbiixzbwcmqritxj.supabase.co"
    SUPABASE_PUBLISHABLE_KEY = "sb_publishable_JrJx0Hkkz3p7fBMT_z08WA_A9Dv5HQn"
    QUIZIO_OWNER_EMAIL = "aymenlasfar4@icloud.com"

[env]
  DEPLOY_TARGET = 'panel'
  NODE_ENV = 'production'
  PANEL_PUBLIC_URL = 'https://quizoi-management.fly.dev/admin'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
